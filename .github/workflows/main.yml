
name: Diabetes Digital Twin CI and Environments

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select pipeline environment'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

jobs:
  test-and-pipeline:
    name: Tests and ${{ inputs.environment || 'dev' }} pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Generate synthetic cohort and run analysis
        env:
          APP_ENV: ${{ inputs.environment || 'dev' }}
        run: python -m dtwin.cli run --env "$APP_ENV"

      - name: Validate generated artifacts
        env:
          APP_ENV: ${{ inputs.environment || 'dev' }}
        run: python -m dtwin.cli check --env "$APP_ENV"

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-digital-twin-${{ inputs.environment || 'dev' }}
          path: artifacts/${{ inputs.environment || 'dev' }}/
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile builds
        run: docker build --tag diabetes-digital-twin:ci .
