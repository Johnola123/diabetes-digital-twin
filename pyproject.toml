
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-digital-twin"
version = "0.1.0"
description = "Longitudinal Type 2 Diabetes Digital Twin Platform"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "streamlit",
    "plotly",
    "PyYAML",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]
